<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leitor de Coordenadas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url("app.css");
  </style>
</head>
<body>
  <header>
    <h1>📍 Leitor de Coordenadas</h1>
    <input id="search" type="search" placeholder="Buscar endereço ou lugar..." />
    <button id="btnSearch">Buscar</button>
    <button id="btnMe" class="secondary">Minha localização</button>
    <button id="btnCam" class="camera">📷 Câmera / papel</button>
    <button id="btnFile" class="secondary">Arquivo</button>
    <input id="fileIn" type="file" accept="image/*" />
  </header>
  <div id="map"></div>
  <p class="hint">Clique no mapa, use GPS ou aponte a câmera para um papel com coordenadas (decimal, GMS ou UTM).</p>
  <div id="panel">
    <div class="coord-box">
      <label>Decimal (lat, lon)</label>
      <div class="value" id="dd">—</div>
    </div>
    <div class="coord-box">
      <label>Graus, minutos, segundos</label>
      <div class="value" id="dms">—</div>
    </div>
    <div class="coord-box">
      <label>UTM (WGS84)</label>
      <div class="value" id="utm">—</div>
    </div>
    <div class="coord-box">
      <label>Endereço / OCR</label>
      <div class="value" id="addr">—</div>
    </div>
  </div>

  <div id="camOverlay">
    <video id="camVideo" playsinline autoplay muted></video>
    <canvas id="camCanvas"></canvas>
    <div id="ocrRaw"></div>
    <div class="cam-bar">
      <span id="ocrStatus">Aponte para o papel e capture.</span>
      <button id="btnSnap">Capturar e ler</button>
      <button id="btnCloseCam" class="secondary">Fechar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const map = L.map("map").setView([-15.78, -47.93], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marker = null;
    let stream = null;
    let worker = null;

    function toDMS(deg, isLat) {
      const abs = Math.abs(deg);
      const d = Math.floor(abs);
      const mFloat = (abs - d) * 60;
      const m = Math.floor(mFloat);
      const s = ((mFloat - m) * 60).toFixed(2);
      const hemi = isLat ? (deg >= 0 ? "N" : "S") : (deg >= 0 ? "E" : "W");
      return `${d}° ${m}' ${s}" ${hemi}`;
    }

    function latLonToUtm(lat, lon) {
      const a = 6378137.0;
      const e2 = 0.00669437999014;
      const k0 = 0.9996;
      let zone = Math.floor((lon + 180) / 6) + 1;
      if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;
      if (lat >= 72 && lat < 84) {
        if (lon >= 0 && lon < 9) zone = 31;
        else if (lon >= 9 && lon < 21) zone = 33;
        else if (lon >= 21 && lon < 33) zone = 35;
        else if (lon >= 33 && lon < 42) zone = 37;
      }
      const latRad = lat * Math.PI / 180;
      const lonRad = lon * Math.PI / 180;
      const lonOrigin = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
      const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
      const T = Math.tan(latRad) ** 2;
      const C = (e2 / (1 - e2)) * Math.cos(latRad) ** 2;
      const A = Math.cos(latRad) * (lonRad - lonOrigin);
      const M = a * ((1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256) * latRad
        - (3*e2/8 + 3*e2*e2/32 + 45*e2*e2*e2/1024) * Math.sin(2*latRad)
        + (15*e2*e2/256 + 45*e2*e2*e2/1024) * Math.sin(4*latRad)
        - (35*e2*e2*e2/3072) * Math.sin(6*latRad));
      let easting = k0 * N * (A + (1-T+C)*A**3/6 + (5-18*T+T*T+72*C-58*(e2/(1-e2)))*A**5/120) + 500000;
      let northing = k0 * (M + N * Math.tan(latRad) * (A**2/2 + (5-T+9*C+4*C*C)*A**4/24 + (61-58*T+T*T+600*C-330*(e2/(1-e2)))*A**6/720));
      if (lat < 0) northing += 10000000;
      const letter = "CDEFGHJKLMNPQRSTUVWXX".charAt(Math.max(0, Math.min(20, Math.floor((lat + 80) / 8))));
      return `${zone}${letter} ${easting.toFixed(1)} E  ${northing.toFixed(1)} N`;
    }

    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18`;
        const res = await fetch(url, { headers: { "Accept-Language": "pt-BR" } });
        const data = await res.json();
        return data.display_name || "Endereço não encontrado";
      } catch {
        return "Não foi possível obter o endereço";
      }
    }

    async function updatePoint(latlng, extraNote) {
      const lat = latlng.lat;
      const lon = latlng.lng;
      if (marker) marker.setLatLng(latlng);
      else marker = L.marker(latlng).addTo(map);
      map.setView(latlng, Math.max(map.getZoom(), 14));
      document.getElementById("dd").textContent = `${lat.toFixed(7)}, ${lon.toFixed(7)}`;
      document.getElementById("dms").textContent = `${toDMS(lat, true)}, ${toDMS(lon, false)}`;
      document.getElementById("utm").textContent = latLonToUtm(lat, lon);
      document.getElementById("addr").textContent = extraNote || "Buscando endereço…";
      if (!extraNote) {
        document.getElementById("addr").textContent = await reverseGeocode(lat, lon);
      }
    }

    map.on("click", (e) => updatePoint(e.latlng));

    document.getElementById("btnMe").addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Geolocalização não suportada.");
      navigator.geolocation.getCurrentPosition(
        (pos) => updatePoint(L.latLng(pos.coords.latitude, pos.coords.longitude)),
        () => alert("Não foi possível obter sua localização.")
      );
    });

    async function searchPlace(q) {
      if (!q.trim()) return;
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=1`;
      const res = await fetch(url, { headers: { "Accept-Language": "pt-BR" } });
      const data = await res.json();
      if (!data.length) return alert("Nenhum resultado encontrado.");
      updatePoint(L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon)));
    }
    document.getElementById("btnSearch").addEventListener("click", () => searchPlace(document.getElementById("search").value));
    document.getElementById("search").addEventListener("keydown", (e) => { if (e.key === "Enter") searchPlace(e.target.value); });

    /* ---------- Parser de coordenadas no texto OCR ---------- */
    function dmsToDec(d, m, s, hemi) {
      let dec = Math.abs(d) + (m || 0) / 60 + (s || 0) / 3600;
      const h = (hemi || "").toUpperCase();
      if (h === "S" || h === "W" || h === "O" || d < 0) dec = -Math.abs(dec);
      return dec;
    }

    function parseCoordinates(text) {
      const t = text
        .replace(/[Oo0]/g, (ch, i, str) => {
          // cuidado: não substituir tudo; só em contexto numérico é difícil
          return ch;
        })
        .replace(/,/g, ".")
        .replace(/[º°]/g, "°")
        .replace(/[′`´’]/g, "'")
        .replace(/[″""]/g, '"')
        .replace(/\s+/g, " ");

      // Decimal: -23.55052 -46.63331  ou  23.55052 S, 46.63331 W
      const decPair = t.match(/(-?\d{1,3}\.\d{3,})\s*[°]?\s*([NSns])?\s*[,;\s]+\s*(-?\d{1,3}\.\d{3,})\s*[°]?\s*([EOWeow])?/);
      if (decPair) {
        let lat = parseFloat(decPair[1]);
        let lon = parseFloat(decPair[3]);
        const hs = (decPair[2] || "").toUpperCase();
        const hw = (decPair[4] || "").toUpperCase();
        if (hs === "S") lat = -Math.abs(lat);
        if (hs === "N") lat = Math.abs(lat);
        if (hw === "W" || hw === "O") lon = -Math.abs(lon);
        if (hw === "E") lon = Math.abs(lon);
        if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon, kind: "decimal" };
      }

      // Dois decimais soltos em linhas
      const nums = [...t.matchAll(/-?\d{1,3}\.\d{2,}/g)].map(m => parseFloat(m[0]));
      if (nums.length >= 2) {
        const lat = nums[0], lon = nums[1];
        if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon, kind: "decimal" };
      }

      // GMS: 23° 33' 01.8" S  46° 37' 59.9" W
      const dmsRe = /(-?\d{1,3})\s*°\s*(\d{1,2})\s*['']\s*(\d{1,2}(?:\.\d+)?)\s*["']?\s*([NSnsEOWeow])?/g;
      const dms = [...t.matchAll(dmsRe)];
      if (dms.length >= 2) {
        const lat = dmsToDec(+dms[0][1], +dms[0][2], +dms[0][3], dms[0][4] || "S");
        const lon = dmsToDec(+dms[1][1], +dms[1][2], +dms[1][3], dms[1][4] || "W");
        if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon, kind: "GMS" };
      }

      // GMS compacto 23 33 01.8 S
      const dms2 = [...t.matchAll(/(-?\d{1,3})\s+(\d{1,2})\s+(\d{1,2}(?:\.\d+)?)\s*([NSnsEOWeow])/g)];
      if (dms2.length >= 2) {
        const lat = dmsToDec(+dms2[0][1], +dms2[0][2], +dms2[0][3], dms2[0][4]);
        const lon = dmsToDec(+dms2[1][1], +dms2[1][2], +dms2[1][3], dms2[1][4]);
        if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon, kind: "GMS" };
      }

      return null;
    }

    async function ensureWorker() {
      if (worker) return worker;
      document.getElementById("ocrStatus").textContent = "Carregando OCR (primeira vez pode demorar)…";
      worker = await Tesseract.createWorker("por+eng", 1, {
        logger: (m) => {
          if (m.status === "recognizing text") {
            document.getElementById("ocrStatus").textContent = `Lendo… ${Math.round((m.progress || 0) * 100)}%`;
          }
        }
      });
      await worker.setParameters({
        tessedit_char_whitelist: "0123456789NSEWO.,°'\"- "
      });
      return worker;
    }

    async function ocrImage(source) {
      const w = await ensureWorker();
      document.getElementById("ocrStatus").textContent = "Lendo o papel…";
      const { data } = await w.recognize(source);
      const text = (data.text || "").trim();
      document.getElementById("ocrRaw").textContent = text || "(nenhum texto)";
      const parsed = parseCoordinates(text);
      if (!parsed) {
        document.getElementById("ocrStatus").textContent = "Texto lido, mas não achei um par de coordenadas. Tente mais perto / melhor luz.";
        document.getElementById("addr").textContent = "OCR: " + (text.slice(0, 180) || "vazio");
        return;
      }
      document.getElementById("ocrStatus").textContent = `Encontrado (${parsed.kind}): ${parsed.lat.toFixed(6)}, ${parsed.lon.toFixed(6)}`;
      closeCam();
      await updatePoint(L.latLng(parsed.lat, parsed.lon), "Lido do papel (" + parsed.kind + ")");
    }

    async function openCam() {
      const overlay = document.getElementById("camOverlay");
      overlay.classList.add("open");
      document.getElementById("ocrRaw").textContent = "";
      document.getElementById("ocrStatus").textContent = "Aponte para o papel e capture.";
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        const v = document.getElementById("camVideo");
        v.srcObject = stream;
        await v.play();
      } catch (err) {
        document.getElementById("ocrStatus").textContent = "Sem acesso à câmera. Use “Arquivo” para enviar uma foto.";
      }
    }

    function closeCam() {
      document.getElementById("camOverlay").classList.remove("open");
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    document.getElementById("btnCam").addEventListener("click", openCam);
    document.getElementById("btnCloseCam").addEventListener("click", closeCam);

    document.getElementById("btnSnap").addEventListener("click", async () => {
      const v = document.getElementById("camVideo");
      const c = document.getElementById("camCanvas");
      if (!v.videoWidth) {
        document.getElementById("ocrStatus").textContent = "Câmera ainda não pronta.";
        return;
      }
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      await ocrImage(c);
    });

    document.getElementById("btnFile").addEventListener("click", () => document.getElementById("fileIn").click());
    document.getElementById("fileIn").addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      document.getElementById("camOverlay").classList.add("open");
      await ocrImage(f);
    });
  </script>
</body>
</html>
